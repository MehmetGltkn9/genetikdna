<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetik Danışmanlık - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-user-md me-2"></i>Genetik Danışmanlık</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Danışmanlık
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kullanıcı ID</th>
                            <th>Danışman Adı</th>
                            <th>Görüşme Tarihi</th>
                            <th>Görüşme Özeti</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="danismanlikTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Genetik Danışmanlık Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı ID</label>
                            <input type="number" class="form-control" name="kullaniciId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Danışman Adı</label>
                            <input type="text" class="form-control" name="danismanAdi" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Görüşme Tarihi</label>
                            <input type="datetime-local" class="form-control" name="gorusmeTarihi" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Görüşme Özeti</label>
                            <textarea class="form-control" name="gorusmeOzeti" rows="4"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addDanismanlik()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        async function loadDanismanliklar() {
            try {
                const response = await fetch(`${API_BASE}/genetik-danismanlik`);
                const data = await response.json();
                
                const tbody = document.getElementById('danismanlikTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">Henüz danışmanlık bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(d => `
                    <tr>
                        <td>${d.id}</td>
                        <td>${d.kullaniciId || '-'}</td>
                        <td>${d.danismanAdi || '-'}</td>
                        <td>${d.gorusmeTarihi ? new Date(d.gorusmeTarihi).toLocaleString('tr-TR') : '-'}</td>
                        <td>${d.gorusmeOzeti ? (d.gorusmeOzeti.length > 40 ? d.gorusmeOzeti.substring(0, 40) + '...' : d.gorusmeOzeti) : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewKullaniciDanismanliklari(${d.kullaniciId})" title="Kullanıcı Danışmanlıkları">
                                <i class="fas fa-list"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteDanismanlik(${d.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Danışmanlıklar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addDanismanlik() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const gorusmeTarihi = formData.get('gorusmeTarihi');
            const timestamp = gorusmeTarihi ? new Date(gorusmeTarihi).toISOString().slice(0, 19).replace('T', ' ') : null;
            
            const data = {
                kullaniciId: parseInt(formData.get('kullaniciId')),
                danismanAdi: formData.get('danismanAdi'),
                gorusmeTarihi: timestamp,
                gorusmeOzeti: formData.get('gorusmeOzeti')
            };

            try {
                const response = await fetch(`${API_BASE}/genetik-danismanlik`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Genetik danışmanlık başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadDanismanliklar();
                } else {
                    showAlert('Danışmanlık eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteDanismanlik(id) {
            if (!confirm('Bu danışmanlığı silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/genetik-danismanlik/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Danışmanlık başarıyla silindi!', 'success');
                    loadDanismanliklar();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewKullaniciDanismanliklari(kullaniciId) {
            try {
                const response = await fetch(`${API_BASE}/genetik-danismanlik/kullanicilar/${kullaniciId}`);
                const data = await response.json();
                alert('Kullanıcı danışmanlıkları:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Danışmanlıklar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        loadDanismanliklar();
    </script>
</body>
</html>
