<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soy Ağacı Bağlantıları - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-sitemap me-2"></i>Soy Ağacı Bağlantıları</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Bağlantı
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kullanıcı 1 ID</th>
                            <th>Kullanıcı 2 ID</th>
                            <th>Tahmini İlişki</th>
                            <th>Paylaşılan DNA (%)</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="baglantiTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Soy Ağacı Bağlantısı Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı 1 ID</label>
                            <input type="number" class="form-control" name="kullaniciBirId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı 2 ID</label>
                            <input type="number" class="form-control" name="kullaniciIkiId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tahmini İlişki</label>
                            <select class="form-select" name="tahminiIliski" required>
                                <option value="">Seçiniz</option>
                                <option value="Kardeş">Kardeş</option>
                                <option value="Kuzen">Kuzen</option>
                                <option value="Amca/Yeğen">Amca/Yeğen</option>
                                <option value="Teyze/Yeğen">Teyze/Yeğen</option>
                                <option value="Dayı/Yeğen">Dayı/Yeğen</option>
                                <option value="Hala/Yeğen">Hala/Yeğen</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Paylaşılan DNA (%)</label>
                            <input type="number" step="0.01" class="form-control" name="paylasilanDna" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addBaglanti()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        async function loadBaglantilar() {
            try {
                const response = await fetch(`${API_BASE}/soyagaci-baglantilari`);
                const data = await response.json();
                
                const tbody = document.getElementById('baglantiTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">Henüz bağlantı bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(b => `
                    <tr>
                        <td>${b.id}</td>
                        <td>${b.kullaniciBirId || '-'}</td>
                        <td>${b.kullaniciIkiId || '-'}</td>
                        <td>${b.tahminiIliski || '-'}</td>
                        <td>${b.paylasilanDna ? b.paylasilanDna.toFixed(2) + '%' : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewKullaniciBaglantilari(${b.kullaniciBirId})" title="Kullanıcı Bağlantıları">
                                <i class="fas fa-list"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteBaglanti(${b.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Bağlantılar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addBaglanti() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                kullaniciBirId: parseInt(formData.get('kullaniciBirId')),
                kullaniciIkiId: parseInt(formData.get('kullaniciIkiId')),
                tahminiIliski: formData.get('tahminiIliski'),
                paylasilanDna: parseFloat(formData.get('paylasilanDna'))
            };

            try {
                const response = await fetch(`${API_BASE}/soyagaci-baglantilari`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Soy ağacı bağlantısı başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadBaglantilar();
                } else {
                    showAlert('Bağlantı eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteBaglanti(id) {
            if (!confirm('Bu bağlantıyı silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/soyagaci-baglantilari/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Bağlantı başarıyla silindi!', 'success');
                    loadBaglantilar();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewKullaniciBaglantilari(kullaniciId) {
            try {
                const response = await fetch(`${API_BASE}/soyagaci-baglantilari/kullanicilar/${kullaniciId}`);
                const data = await response.json();
                alert('Kullanıcı bağlantıları:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Bağlantılar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        loadBaglantilar();
    </script>
</body>
</html>
