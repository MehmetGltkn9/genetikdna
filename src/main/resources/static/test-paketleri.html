<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Paketleri - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-box me-2"></i>Test Paketleri</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Paket
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Paket Adı</th>
                            <th>Fiyat</th>
                            <th>İçerik Açıklaması</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="paketTableBody">
                        <tr>
                            <td colspan="5" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Test Paketi Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Paket Adı</label>
                            <input type="text" class="form-control" name="paketAdi" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fiyat</label>
                            <input type="number" step="0.01" class="form-control" name="fiyat" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">İçerik Açıklaması</label>
                            <textarea class="form-control" name="icerikAciklamasi" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addPaket()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        async function loadPaketler() {
            try {
                const response = await fetch(`${API_BASE}/test-paketleri`);
                const data = await response.json();
                
                const tbody = document.getElementById('paketTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">Henüz paket bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(p => `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.paketAdi || '-'}</td>
                        <td>${p.fiyat ? p.fiyat.toFixed(2) + ' ₺' : '-'}</td>
                        <td>${p.icerikAciklamasi || '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewSiparisler(${p.id})" title="Siparişler">
                                <i class="fas fa-shopping-cart"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deletePaket(${p.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Paketler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addPaket() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                paketAdi: formData.get('paketAdi'),
                fiyat: parseFloat(formData.get('fiyat')),
                icerikAciklamasi: formData.get('icerikAciklamasi')
            };

            try {
                const response = await fetch(`${API_BASE}/test-paketleri`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Paket başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadPaketler();
                } else {
                    showAlert('Paket eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deletePaket(id) {
            if (!confirm('Bu paketi silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/test-paketleri/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Paket başarıyla silindi!', 'success');
                    loadPaketler();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewSiparisler(id) {
            try {
                const response = await fetch(`${API_BASE}/test-paketleri/${id}/siparisler`);
                const data = await response.json();
                alert('Bu pakete ait siparişler:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Siparişler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        loadPaketler();
    </script>
</body>
</html>
