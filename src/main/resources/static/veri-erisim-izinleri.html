<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veri Erişim İzinleri - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .badge-modern {
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-shield-alt me-2"></i>Veri Erişim İzinleri</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni İzin
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kullanıcı ID</th>
                            <th>İzin Tipi</th>
                            <th>İzin Verildi</th>
                            <th>İzin Tarihi</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="izinTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Veri Erişim İzni Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı ID</label>
                            <input type="number" class="form-control" name="kullaniciId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">İzin Tipi</label>
                            <select class="form-select" name="izinTipi" required>
                                <option value="">Seçiniz</option>
                                <option value="Okuma">Okuma</option>
                                <option value="Yazma">Yazma</option>
                                <option value="Silme">Silme</option>
                                <option value="Tam Erişim">Tam Erişim</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="izinVerildi" id="izinVerildi">
                                <label class="form-check-label" for="izinVerildi">İzin Verildi</label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addIzin()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        async function loadIzinler() {
            try {
                const response = await fetch(`${API_BASE}/veri-erisim-izinleri`);
                const data = await response.json();
                
                const tbody = document.getElementById('izinTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">Henüz izin bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(i => `
                    <tr>
                        <td>${i.id}</td>
                        <td>${i.kullaniciId || '-'}</td>
                        <td>${i.izinTipi || '-'}</td>
                        <td>${i.izinVerildi ? '<span class="badge bg-success badge-modern">Verildi</span>' : '<span class="badge bg-danger badge-modern">Verilmedi</span>'}</td>
                        <td>${i.izinTarihi ? new Date(i.izinTarihi).toLocaleString('tr-TR') : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewKullaniciIzinleri(${i.kullaniciId})" title="Kullanıcı İzinleri">
                                <i class="fas fa-list"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteIzin(${i.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('İzinler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addIzin() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                kullaniciId: parseInt(formData.get('kullaniciId')),
                izinTipi: formData.get('izinTipi'),
                izinVerildi: document.getElementById('izinVerildi').checked
            };

            try {
                const response = await fetch(`${API_BASE}/veri-erisim-izinleri`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Veri erişim izni başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadIzinler();
                } else {
                    showAlert('İzin eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteIzin(id) {
            if (!confirm('Bu izni silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/veri-erisim-izinleri/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('İzin başarıyla silindi!', 'success');
                    loadIzinler();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewKullaniciIzinleri(kullaniciId) {
            try {
                const response = await fetch(`${API_BASE}/veri-erisim-izinleri/kullanicilar/${kullaniciId}`);
                const data = await response.json();
                alert('Kullanıcı izinleri:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('İzinler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        loadIzinler();
    </script>
</body>
</html>
