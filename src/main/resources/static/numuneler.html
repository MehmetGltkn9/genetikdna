<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numuneler - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .badge-modern {
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-flask me-2"></i>Numuneler</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Numune
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Sipariş ID</th>
                            <th>Barkod ID</th>
                            <th>Numune Tipi</th>
                            <th>Laboratuvara Varis</th>
                            <th>Durum</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="numuneTableBody">
                        <tr>
                            <td colspan="7" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Numune Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Sipariş ID</label>
                            <input type="number" class="form-control" name="siparisId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Barkod ID</label>
                            <input type="text" class="form-control" name="barkodId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Numune Tipi</label>
                            <select class="form-select" name="numuneTipi" required>
                                <option value="">Seçiniz</option>
                                <option value="Tükürük">Tükürük</option>
                                <option value="Kan">Kan</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Laboratuvara Varis</label>
                            <input type="date" class="form-control" name="laboratuvaraVaris">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Durum</label>
                            <select class="form-select" name="durum" required>
                                <option value="Beklemede">Beklemede</option>
                                <option value="Hazırlanıyor">Hazırlanıyor</option>
                                <option value="Tamamlandı">Tamamlandı</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addNumune()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        function getStatusBadge(status) {
            const badges = {
                'Tamamlandı': 'success',
                'Hazırlanıyor': 'warning',
                'Beklemede': 'secondary'
            };
            return `<span class="badge bg-${badges[status] || 'secondary'} badge-modern">${status}</span>`;
        }

        async function loadNumuneler() {
            try {
                const response = await fetch(`${API_BASE}/numuneler`);
                const data = await response.json();
                
                const tbody = document.getElementById('numuneTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Henüz numune bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(n => `
                    <tr>
                        <td>${n.id}</td>
                        <td>${n.siparisId || '-'}</td>
                        <td>${n.barkodId || '-'}</td>
                        <td>${n.numuneTipi || '-'}</td>
                        <td>${n.laboratuvaraVaris || '-'}</td>
                        <td>${getStatusBadge(n.durum || 'Beklemede')}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewSiparisNumuneleri(${n.siparisId})" title="Sipariş Numuneleri">
                                <i class="fas fa-list"></i>
                            </button>
                            <button class="btn btn-sm btn-primary me-1" onclick="viewAnalizler(${n.id})" title="Analizler">
                                <i class="fas fa-microscope"></i>
                            </button>
                            <button class="btn btn-sm btn-warning me-1" onclick="searchByBarkod('${n.barkodId}')" title="Barkod ile Ara">
                                <i class="fas fa-search"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteNumune(${n.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Numuneler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addNumune() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                siparisId: parseInt(formData.get('siparisId')),
                barkodId: formData.get('barkodId'),
                numuneTipi: formData.get('numuneTipi'),
                laboratuvaraVaris: formData.get('laboratuvaraVaris') || null,
                durum: formData.get('durum')
            };

            try {
                const response = await fetch(`${API_BASE}/numuneler`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Numune başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadNumuneler();
                } else {
                    showAlert('Numune eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteNumune(id) {
            if (!confirm('Bu numuneyi silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/numuneler/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Numune başarıyla silindi!', 'success');
                    loadNumuneler();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewSiparisNumuneleri(siparisId) {
            try {
                const response = await fetch(`${API_BASE}/numuneler/siparisler/${siparisId}`);
                const data = await response.json();
                alert('Sipariş numuneleri:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Numuneler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function viewAnalizler(numuneId) {
            try {
                const response = await fetch(`${API_BASE}/numuneler/${numuneId}/analizler`);
                const data = await response.json();
                alert('Numune analizleri:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Analizler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function searchByBarkod(barkodId) {
            try {
                const response = await fetch(`${API_BASE}/numuneler/barkod/${encodeURIComponent(barkodId)}`);
                const data = await response.json();
                alert('Numune bilgileri:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Numune bulunamadı: ' + error.message, 'danger');
            }
        }

        loadNumuneler();
    </script>
</body>
</html>
