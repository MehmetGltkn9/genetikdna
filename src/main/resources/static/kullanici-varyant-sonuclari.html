<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Varyant Sonuçları - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-dna me-2"></i>Kullanıcı Varyant Sonuçları</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Sonuç
                    </button>
                    <button class="btn btn-success btn-modern" data-bs-toggle="modal" data-bs-target="#topluEkleModal">
                        <i class="fas fa-layer-group me-2"></i>Toplu Ekle (SP)
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Sonuç ID</th>
                            <th>Varyant ID</th>
                            <th>Tespit Edilen Alel</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="sonucTableBody">
                        <tr>
                            <td colspan="5" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Varyant Sonucu Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Sonuç ID</label>
                            <input type="number" class="form-control" name="sonucId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Varyant ID</label>
                            <input type="number" class="form-control" name="varyantId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tespit Edilen Alel</label>
                            <input type="text" class="form-control" name="tespitEdilenAlel" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addSonuc()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toplu Ekleme Modal (Stored Procedure) -->
    <div class="modal fade" id="topluEkleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Toplu Varyant Sonucu Ekle (Stored Procedure)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="topluEkleForm">
                        <div class="mb-3">
                            <label class="form-label">Sonuç ID</label>
                            <input type="number" class="form-control" name="sonucId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Varyant Verileri (JSON)</label>
                            <textarea class="form-control" name="varyantVerileri" rows="5" required placeholder='[{"varyant_id":1,"alel":"A"},{"varyant_id":2,"alel":"G"}]'></textarea>
                            <small class="form-text text-muted">JSON formatında varyant verileri girin</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-success" onclick="topluEkle()">Toplu Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        async function loadSonuclar() {
            try {
                const response = await fetch(`${API_BASE}/kullanici-varyant-sonuclari`);
                const data = await response.json();
                
                const tbody = document.getElementById('sonucTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">Henüz sonuç bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(s => `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.sonucId || '-'}</td>
                        <td>${s.varyantId || '-'}</td>
                        <td>${s.tespitEdilenAlel || '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewSonucVaryantlari(${s.sonucId})" title="Sonuç Varyantları">
                                <i class="fas fa-list"></i>
                            </button>
                            <button class="btn btn-sm btn-primary me-1" onclick="viewVaryantSonuclari(${s.varyantId})" title="Varyant Sonuçları">
                                <i class="fas fa-dna"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSonuc(${s.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Sonuçlar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addSonuc() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                sonucId: parseInt(formData.get('sonucId')),
                varyantId: parseInt(formData.get('varyantId')),
                tespitEdilenAlel: formData.get('tespitEdilenAlel')
            };

            try {
                const response = await fetch(`${API_BASE}/kullanici-varyant-sonuclari`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Varyant sonucu başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadSonuclar();
                } else {
                    showAlert('Sonuç eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function topluEkle() {
            const form = document.getElementById('topluEkleForm');
            const formData = new FormData(form);
            
            const data = {
                sonucId: parseInt(formData.get('sonucId')),
                varyantVerileri: formData.get('varyantVerileri')
            };

            try {
                const response = await fetch(`${API_BASE}/kullanici-varyant-sonuclari/toplu-ekle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    showAlert(`${result.eklenen_sayisi} varyant sonucu başarıyla eklendi!`, 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('topluEkleModal')).hide();
                    loadSonuclar();
                } else {
                    showAlert('Hata: ' + (result.message || 'Bilinmeyen hata'), 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteSonuc(id) {
            if (!confirm('Bu sonucu silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/kullanici-varyant-sonuclari/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Sonuç başarıyla silindi!', 'success');
                    loadSonuclar();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewSonucVaryantlari(sonucId) {
            try {
                const response = await fetch(`${API_BASE}/kullanici-varyant-sonuclari/sonuclar/${sonucId}`);
                const data = await response.json();
                alert('Sonuç varyantları:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Varyantlar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function viewVaryantSonuclari(varyantId) {
            try {
                const response = await fetch(`${API_BASE}/kullanici-varyant-sonuclari/varyantlar/${varyantId}`);
                const data = await response.json();
                alert('Varyant sonuçları:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Sonuçlar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        loadSonuclar();
    </script>
</body>
</html>
