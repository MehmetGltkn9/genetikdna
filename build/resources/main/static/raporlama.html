<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raporlama - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .card-modern {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        .card-header-modern {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-chart-bar me-2"></i>Raporlama (Fonksiyon ile)</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                </div>
            </div>

            <div id="alertContainer"></div>

            <!-- Kullanıcı Detaylı Raporu -->
            <div class="card card-modern">
                <div class="card-header card-header-modern">
                    <h5 class="mb-0"><i class="fas fa-user me-2"></i>Kullanıcı Detaylı Raporu</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Kullanıcı ID</label>
                            <input type="number" class="form-control" id="kullaniciRaporId" placeholder="Örn: 1">
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <button class="btn btn-primary btn-modern w-100" onclick="getKullaniciRaporu()">
                                <i class="fas fa-search me-2"></i>Raporu Getir
                            </button>
                        </div>
                    </div>
                    <div id="kullaniciRaporSonuc"></div>
                </div>
            </div>

            <!-- Test Sonuçları Analiz Raporu -->
            <div class="card card-modern">
                <div class="card-header card-header-modern">
                    <h5 class="mb-0"><i class="fas fa-microscope me-2"></i>Test Sonuçları Analiz Raporu</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Başlangıç Tarihi (Opsiyonel)</label>
                            <input type="date" class="form-control" id="testBaslangicTarihi">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Bitiş Tarihi (Opsiyonel)</label>
                            <input type="date" class="form-control" id="testBitisTarihi">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button class="btn btn-primary btn-modern w-100" onclick="getTestSonuclariRaporu()">
                                <i class="fas fa-chart-line me-2"></i>Raporu Getir
                            </button>
                        </div>
                    </div>
                    <div id="testSonuclariRaporSonuc"></div>
                </div>
            </div>

            <!-- Hastalık Risk Analiz Raporu -->
            <div class="card card-modern">
                <div class="card-header card-header-modern">
                    <h5 class="mb-0"><i class="fas fa-heartbeat me-2"></i>Hastalık Risk Analiz Raporu</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Hastalık ID (Opsiyonel - Boş bırakılırsa tüm hastalıklar)</label>
                            <input type="number" class="form-control" id="hastalikRaporId" placeholder="Örn: 1 veya boş">
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <button class="btn btn-primary btn-modern w-100" onclick="getHastalikRiskRaporu()">
                                <i class="fas fa-chart-pie me-2"></i>Raporu Getir
                            </button>
                        </div>
                    </div>
                    <div id="hastalikRiskRaporSonuc"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        function formatNumber(num) {
            if (num === null || num === undefined) return '-';
            return typeof num === 'number' ? num.toLocaleString('tr-TR', {maximumFractionDigits: 2}) : num;
        }

        async function getKullaniciRaporu() {
            const kullaniciId = document.getElementById('kullaniciRaporId').value;
            if (!kullaniciId) {
                showAlert('Lütfen bir kullanıcı ID girin!', 'warning');
                return;
            }

            const sonucDiv = document.getElementById('kullaniciRaporSonuc');
            sonucDiv.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="visually-hidden">Yükleniyor...</span></div></div>';

            try {
                const response = await fetch(`${API_BASE}/raporlama/kullanici/${kullaniciId}`);
                const data = await response.json();
                
                // Hata kontrolü
                if (data.hata) {
                    sonucDiv.innerHTML = `<div class="alert alert-danger">
                        <strong>Hata:</strong> ${data.mesaj || 'Bilinmeyen hata'}<br>
                        <small>${data.detay || ''}</small>
                    </div>`;
                    return;
                }
                
                if (!data || Object.keys(data).length === 0) {
                    sonucDiv.innerHTML = '<div class="alert alert-warning">Bu kullanıcı için veri bulunamadı.</div>';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${JSON.stringify(data)}`);
                }
                
                sonucDiv.innerHTML = `
                    <div class="row">
                        <div class="col-md-3">
                            <div class="stat-card text-center">
                                <div class="stat-value">${formatNumber(data.toplam_siparis_sayisi)}</div>
                                <div class="stat-label">Toplam Sipariş</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card text-center">
                                <div class="stat-value">${formatNumber(data.toplam_harcama)} ₺</div>
                                <div class="stat-label">Toplam Harcama</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card text-center">
                                <div class="stat-value">${formatNumber(data.test_sonucu_sayisi)}</div>
                                <div class="stat-label">Test Sonucu</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stat-card text-center">
                                <div class="stat-value">${formatNumber(data.ortalama_risk_yuzdesi)}%</div>
                                <div class="stat-label">Ortalama Risk</div>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive mt-3">
                        <table class="table table-striped">
                            <tr><th>Kullanıcı Adı:</th><td>${data.kullanici_adi || '-'} ${data.kullanici_soyadi || '-'}</td></tr>
                            <tr><th>Kayıt Tarihi:</th><td>${data.kayit_tarihi ? new Date(data.kayit_tarihi).toLocaleString('tr-TR') : '-'}</td></tr>
                            <tr><th>Ödeme Bekleyen Sipariş:</th><td>${formatNumber(data.odeme_bekleyen_siparis_sayisi)}</td></tr>
                            <tr><th>Risk Skoru Sayısı:</th><td>${formatNumber(data.risk_skoru_sayisi)}</td></tr>
                            <tr><th>En Yüksek Risk Hastalık:</th><td>${data.en_yuksek_risk_hastalik || '-'}</td></tr>
                            <tr><th>Numune Sayısı:</th><td>${formatNumber(data.numune_sayisi)}</td></tr>
                            <tr><th>Aktif Hesap Sayısı:</th><td>${formatNumber(data.aktif_hesap_sayisi)}</td></tr>
                            <tr><th>Adres Sayısı:</th><td>${formatNumber(data.adres_sayisi)}</td></tr>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('Kullanıcı raporu hatası:', error);
                console.error('Response:', error.response);
                sonucDiv.innerHTML = `<div class="alert alert-danger">
                    <strong>Hata:</strong> ${error.message}<br>
                    <small>Konsolu kontrol edin (F12) daha fazla detay için.</small><br>
                    <small>API Endpoint: ${API_BASE}/raporlama/kullanici/${kullaniciId}</small>
                </div>`;
                showAlert('Rapor yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function getTestSonuclariRaporu() {
            const baslangic = document.getElementById('testBaslangicTarihi').value;
            const bitis = document.getElementById('testBitisTarihi').value;
            
            let url = `${API_BASE}/raporlama/test-sonuclari`;
            if (baslangic && bitis) {
                url += `?baslangicTarihi=${baslangic}&bitisTarihi=${bitis}`;
            }

            const sonucDiv = document.getElementById('testSonuclariRaporSonuc');
            sonucDiv.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="visually-hidden">Yükleniyor...</span></div></div>';

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Hata kontrolü
                if (data.hata) {
                    sonucDiv.innerHTML = `<div class="alert alert-danger">
                        <strong>Hata:</strong> ${data.mesaj || 'Bilinmeyen hata'}
                    </div>`;
                    return;
                }
                
                if (!data || Object.keys(data).length === 0) {
                    sonucDiv.innerHTML = '<div class="alert alert-warning">Test sonuçları için veri bulunamadı.</div>';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${JSON.stringify(data)}`);
                }
                
                sonucDiv.innerHTML = `
                    <div class="row">
                        <div class="col-md-4">
                            <div class="stat-card text-center">
                                <div class="stat-value">${formatNumber(data.toplam_test_sayisi)}</div>
                                <div class="stat-label">Toplam Test</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-card text-center">
                                <div class="stat-value">${formatNumber(data.ortalama_test_suresi_gun)}</div>
                                <div class="stat-label">Ortalama Süre (Gün)</div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="stat-card text-center">
                                <div class="stat-value">${formatNumber(data.toplam_varyant_sayisi)}</div>
                                <div class="stat-label">Toplam Varyant</div>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive mt-3">
                        <table class="table table-striped">
                            <tr><th>En Çok Test Yapan Kullanıcı:</th><td>${data.en_cok_test_yapan_kullanici || '-'}</td></tr>
                            <tr><th>En Sık Görülen Hastalık:</th><td>${data.en_sik_gorulen_hastalik || '-'}</td></tr>
                            <tr><th>Aktif Numune Sayısı:</th><td>${formatNumber(data.aktif_numune_sayisi)}</td></tr>
                            <tr><th>Tamamlanan Analiz Sayısı:</th><td>${formatNumber(data.tamamlanan_analiz_sayisi)}</td></tr>
                            <tr><th>Test Sonucu Dağılımı:</th><td><pre>${JSON.stringify(data.test_sonucu_dagilimi, null, 2)}</pre></td></tr>
                            <tr><th>Risk Seviyesi Dağılımı:</th><td><pre>${JSON.stringify(data.risk_seviyesi_dagilimi, null, 2)}</pre></td></tr>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('Test sonuçları raporu hatası:', error);
                console.error('URL:', url);
                sonucDiv.innerHTML = `<div class="alert alert-danger">
                    <strong>Hata:</strong> ${error.message}<br>
                    <small>Konsolu kontrol edin (F12) daha fazla detay için.</small><br>
                    <small>API Endpoint: ${url}</small>
                </div>`;
                showAlert('Rapor yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function getHastalikRiskRaporu() {
            const hastalikId = document.getElementById('hastalikRaporId').value;
            
            let url = `${API_BASE}/raporlama/hastalik-risk`;
            if (hastalikId) {
                url += `?hastalikId=${hastalikId}`;
            }

            const sonucDiv = document.getElementById('hastalikRiskRaporSonuc');
            sonucDiv.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="visually-hidden">Yükleniyor...</span></div></div>';

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Hata kontrolü
                if (data.hata) {
                    sonucDiv.innerHTML = `<div class="alert alert-danger">
                        <strong>Hata:</strong> ${data.mesaj || 'Bilinmeyen hata'}
                    </div>`;
                    return;
                }
                
                if (Array.isArray(data) && data.length > 0) {
                    let html = '<div class="table-responsive"><table class="table table-striped"><thead><tr>';
                    html += '<th>Hastalık Adı</th><th>ICD Kodu</th><th>Test Sayısı</th><th>Ortalama Risk</th>';
                    html += '<th>En Yüksek Risk</th><th>Yüksek Riskli</th><th>Orta Riskli</th><th>Düşük Riskli</th>';
                    html += '</tr></thead><tbody>';
                    
                    data.forEach(h => {
                        html += `<tr>
                            <td>${h.hastalik_adi || '-'}</td>
                            <td>${h.icd_kodu || '-'}</td>
                            <td>${formatNumber(h.toplam_test_sayisi)}</td>
                            <td>${formatNumber(h.ortalama_risk_yuzdesi)}%</td>
                            <td>${formatNumber(h.en_yuksek_risk_yuzdesi)}%</td>
                            <td>${formatNumber(h.yuksek_riskli_kullanici_sayisi)}</td>
                            <td>${formatNumber(h.orta_riskli_kullanici_sayisi)}</td>
                            <td>${formatNumber(h.dusuk_riskli_kullanici_sayisi)}</td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table></div>';
                    sonucDiv.innerHTML = html;
                } else if (Array.isArray(data) && data.length === 0) {
                    sonucDiv.innerHTML = '<div class="alert alert-info">Bu kriterlere uygun hastalık risk raporu bulunamadı.</div>';
                } else {
                    sonucDiv.innerHTML = '<div class="alert alert-warning">Rapor verisi beklenmeyen formatta geldi.</div>';
                }
            } catch (error) {
                console.error('Hastalık risk raporu hatası:', error);
                console.error('URL:', url);
                sonucDiv.innerHTML = `<div class="alert alert-danger">
                    <strong>Hata:</strong> ${error.message}<br>
                    <small>Konsolu kontrol edin (F12) daha fazla detay için.</small><br>
                    <small>API Endpoint: ${url}</small>
                </div>`;
                showAlert('Rapor yüklenirken hata: ' + error.message, 'danger');
            }
        }

        // Sayfa yüklendiğinde test endpoint'ini kontrol et
        window.addEventListener('load', async function() {
            try {
                const response = await fetch(`${API_BASE}/raporlama/test`);
                const data = await response.json();
                if (data.durum === 'hata') {
                    console.warn('Raporlama fonksiyonları testi başarısız:', data.mesaj);
                } else {
                    console.log('Raporlama fonksiyonları hazır:', data.mesaj);
                }
            } catch (error) {
                console.warn('Raporlama test endpoint\'i çalışmıyor:', error);
            }
        });
    </script>
</body>
</html>
