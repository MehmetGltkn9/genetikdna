<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adresler - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-map-marker-alt me-2"></i>Adresler</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Adres
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kullanıcı ID</th>
                            <th>Adres Tipi</th>
                            <th>Ülke</th>
                            <th>Şehir</th>
                            <th>Posta Kodu</th>
                            <th>Detaylı Adres</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="adresTableBody">
                        <tr>
                            <td colspan="8" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Adres Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Kullanıcı ID</label>
                                <input type="number" class="form-control" name="kullaniciId" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Adres Tipi</label>
                                <select class="form-select" name="adresTipi" required>
                                    <option value="">Seçiniz</option>
                                    <option value="Fatura">Fatura</option>
                                    <option value="Numune Gönderim">Numune Gönderim</option>
                                    <option value="Diğer">Diğer</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ülke</label>
                                <input type="text" class="form-control" name="ulke" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Şehir</label>
                                <input type="text" class="form-control" name="sehir" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Posta Kodu</label>
                            <input type="text" class="form-control" name="postaKodu">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Detaylı Adres</label>
                            <textarea class="form-control" name="detayliAdres" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addAdres()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        async function loadAdresler() {
            try {
                const response = await fetch(`${API_BASE}/adresler`);
                const data = await response.json();
                
                const tbody = document.getElementById('adresTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center">Henüz adres bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(a => `
                    <tr>
                        <td>${a.id}</td>
                        <td>${a.kullaniciId || '-'}</td>
                        <td>${a.adresTipi || '-'}</td>
                        <td>${a.ulke || '-'}</td>
                        <td>${a.sehir || '-'}</td>
                        <td>${a.postaKodu || '-'}</td>
                        <td>${a.detayliAdres ? (a.detayliAdres.length > 30 ? a.detayliAdres.substring(0, 30) + '...' : a.detayliAdres) : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewKullaniciAdresleri(${a.kullaniciId})" title="Kullanıcı Adresleri">
                                <i class="fas fa-list"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteAdres(${a.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Adresler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addAdres() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                kullaniciId: parseInt(formData.get('kullaniciId')),
                adresTipi: formData.get('adresTipi'),
                ulke: formData.get('ulke'),
                sehir: formData.get('sehir'),
                postaKodu: formData.get('postaKodu'),
                detayliAdres: formData.get('detayliAdres')
            };

            try {
                const response = await fetch(`${API_BASE}/adresler`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Adres başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadAdresler();
                } else {
                    showAlert('Adres eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteAdres(id) {
            if (!confirm('Bu adresi silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/adresler/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Adres başarıyla silindi!', 'success');
                    loadAdresler();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewKullaniciAdresleri(kullaniciId) {
            try {
                const response = await fetch(`${API_BASE}/adresler/kullanicilar/${kullaniciId}`);
                const data = await response.json();
                alert('Kullanıcı adresleri:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Adresler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        loadAdresler();
    </script>
</body>
</html>
