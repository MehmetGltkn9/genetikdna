<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hastalık Tanımları - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-notes-medical me-2"></i>Hastalık Tanımları</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Hastalık
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Hastalık Adı</th>
                            <th>ICD Kodu</th>
                            <th>Bilimsel Tanım</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="hastalikTableBody">
                        <tr>
                            <td colspan="5" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Hastalık Tanımı Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Hastalık Adı</label>
                            <input type="text" class="form-control" name="hastalikAdi" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ICD Kodu</label>
                            <input type="text" class="form-control" name="icdKodu" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Bilimsel Tanım</label>
                            <textarea class="form-control" name="bilimselTanim" rows="4"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addHastalik()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        async function loadHastaliklar() {
            try {
                const response = await fetch(`${API_BASE}/hastalik-tanimlari`);
                const data = await response.json();
                
                const tbody = document.getElementById('hastalikTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">Henüz hastalık bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(h => `
                    <tr>
                        <td>${h.id}</td>
                        <td>${h.hastalikAdi || '-'}</td>
                        <td>${h.icdKodu || '-'}</td>
                        <td>${h.bilimselTanim ? (h.bilimselTanim.length > 50 ? h.bilimselTanim.substring(0, 50) + '...' : h.bilimselTanim) : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-warning me-1" onclick="searchByIcdKodu('${h.icdKodu}')" title="ICD Kodu ile Ara">
                                <i class="fas fa-search"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteHastalik(${h.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Hastalıklar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addHastalik() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                hastalikAdi: formData.get('hastalikAdi'),
                icdKodu: formData.get('icdKodu'),
                bilimselTanim: formData.get('bilimselTanim')
            };

            try {
                const response = await fetch(`${API_BASE}/hastalik-tanimlari`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Hastalık tanımı başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadHastaliklar();
                } else {
                    showAlert('Hastalık eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteHastalik(id) {
            if (!confirm('Bu hastalık tanımını silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/hastalik-tanimlari/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Hastalık başarıyla silindi!', 'success');
                    loadHastaliklar();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function searchByIcdKodu(icdKodu) {
            try {
                const response = await fetch(`${API_BASE}/hastalik-tanimlari/icd-kodu/${encodeURIComponent(icdKodu)}`);
                const data = await response.json();
                alert('Hastalık bilgileri:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Hastalık bulunamadı: ' + error.message, 'danger');
            }
        }

        loadHastaliklar();
    </script>
</body>
</html>
