<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcılar - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .alert-modern {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-users me-2"></i>Kullanıcı Yönetimi</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Kullanıcı
                    </button>
                    <button class="btn btn-success btn-modern" data-bs-toggle="modal" data-bs-target="#addWithAccountModal">
                        <i class="fas fa-user-plus me-2"></i>Kullanıcı + Hesap (SP)
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Ad</th>
                            <th>Soyad</th>
                            <th>Doğum Tarihi</th>
                            <th>Cinsiyet</th>
                            <th>Kayıt Tarihi</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="kullaniciTableBody">
                        <tr>
                            <td colspan="7" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Kullanıcı Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Ad</label>
                            <input type="text" class="form-control" name="ad" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Soyad</label>
                            <input type="text" class="form-control" name="soyad" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Doğum Tarihi</label>
                            <input type="date" class="form-control" name="dogumTarihi" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cinsiyet</label>
                            <select class="form-select" name="cinsiyet" required>
                                <option value="">Seçiniz</option>
                                <option value="Erkek">Erkek</option>
                                <option value="Kadın">Kadın</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addKullanici()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Kullanıcı + Hesap Ekleme Modal (Stored Procedure) -->
    <div class="modal fade" id="addWithAccountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Kullanıcı + Hesap Ekle (Stored Procedure)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addWithAccountForm">
                        <div class="mb-3">
                            <label class="form-label">Ad</label>
                            <input type="text" class="form-control" name="ad" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Soyad</label>
                            <input type="text" class="form-control" name="soyad" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Doğum Tarihi</label>
                            <input type="date" class="form-control" name="dogumTarihi" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cinsiyet</label>
                            <select class="form-select" name="cinsiyet" required>
                                <option value="">Seçiniz</option>
                                <option value="Erkek">Erkek</option>
                                <option value="Kadın">Kadın</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-posta</label>
                            <input type="email" class="form-control" name="eposta" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Parola Hash</label>
                            <input type="text" class="form-control" name="parolaHash" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-success" onclick="addKullaniciWithAccount()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Güncelleme Modal -->
    <div class="modal fade" id="updateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Kullanıcı Güncelle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="updateForm">
                        <input type="hidden" id="updateId">
                        <div class="mb-3">
                            <label class="form-label">Ad</label>
                            <input type="text" class="form-control" id="updateAd" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Soyad</label>
                            <input type="text" class="form-control" id="updateSoyad" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Doğum Tarihi</label>
                            <input type="date" class="form-control" id="updateDogumTarihi" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cinsiyet</label>
                            <select class="form-select" id="updateCinsiyet" required>
                                <option value="">Seçiniz</option>
                                <option value="Erkek">Erkek</option>
                                <option value="Kadın">Kadın</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı ID (Güncelleme için)</label>
                            <input type="number" class="form-control" id="updateKullaniciId" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="updateKullanici()">Güncelle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-modern alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        async function loadKullanicilar() {
            try {
                const response = await fetch(`${API_BASE}/kullanicilar`);
                const data = await response.json();
                
                const tbody = document.getElementById('kullaniciTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Henüz kullanıcı bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(k => `
                    <tr>
                        <td>${k.id}</td>
                        <td>${k.ad || '-'}</td>
                        <td>${k.soyad || '-'}</td>
                        <td>${k.dogumTarihi || '-'}</td>
                        <td>${k.cinsiyet || '-'}</td>
                        <td>${k.kayitTarihi ? new Date(k.kayitTarihi).toLocaleString('tr-TR') : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewDetails(${k.id})" title="Detaylar">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-warning me-1" onclick="editKullanici(${k.id})" title="Güncelle">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteKullanici(${k.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Kullanıcılar yüklenirken hata oluştu: ' + error.message, 'danger');
            }
        }

        async function addKullanici() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                ad: formData.get('ad'),
                soyad: formData.get('soyad'),
                dogumTarihi: formData.get('dogumTarihi'),
                cinsiyet: formData.get('cinsiyet')
            };

            try {
                const response = await fetch(`${API_BASE}/kullanicilar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Kullanıcı başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadKullanicilar();
                } else {
                    showAlert('Kullanıcı eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function addKullaniciWithAccount() {
            const form = document.getElementById('addWithAccountForm');
            const formData = new FormData(form);
            
            const data = {
                ad: formData.get('ad'),
                soyad: formData.get('soyad'),
                dogumTarihi: formData.get('dogumTarihi'),
                cinsiyet: formData.get('cinsiyet'),
                eposta: formData.get('eposta'),
                parolaHash: formData.get('parolaHash')
            };

            try {
                const response = await fetch(`${API_BASE}/kullanicilar/kullanici-ve-hesap`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    showAlert(`Kullanıcı ve hesap başarıyla eklendi! Kullanıcı ID: ${result.kullanici_id}, Hesap ID: ${result.hesap_id}`, 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addWithAccountModal')).hide();
                    loadKullanicilar();
                } else {
                    showAlert('Hata: ' + (result.message || 'Bilinmeyen hata'), 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function editKullanici(id) {
            try {
                const response = await fetch(`${API_BASE}/kullanicilar/${id}`);
                const data = await response.json();
                
                document.getElementById('updateId').value = data.id;
                document.getElementById('updateAd').value = data.ad || '';
                document.getElementById('updateSoyad').value = data.soyad || '';
                document.getElementById('updateDogumTarihi').value = data.dogumTarihi || '';
                document.getElementById('updateCinsiyet').value = data.cinsiyet || '';
                document.getElementById('updateKullaniciId').value = data.id;
                
                new bootstrap.Modal(document.getElementById('updateModal')).show();
            } catch (error) {
                showAlert('Kullanıcı bilgileri yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function updateKullanici() {
            const id = document.getElementById('updateId').value;
            const kullaniciId = document.getElementById('updateKullaniciId').value;
            
            const data = {
                ad: document.getElementById('updateAd').value,
                soyad: document.getElementById('updateSoyad').value,
                dogumTarihi: document.getElementById('updateDogumTarihi').value,
                cinsiyet: document.getElementById('updateCinsiyet').value
            };

            try {
                const response = await fetch(`${API_BASE}/kullanicilar/${id}/guncelle?kullaniciId=${kullaniciId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    showAlert('Kullanıcı başarıyla güncellendi!', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('updateModal')).hide();
                    loadKullanicilar();
                } else {
                    showAlert('Güncelleme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteKullanici(id) {
            if (!confirm('Bu kullanıcıyı silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/kullanicilar/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Kullanıcı başarıyla silindi!', 'success');
                    loadKullanicilar();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewDetails(id) {
            try {
                const response = await fetch(`${API_BASE}/kullanicilar/${id}/detaylar`);
                const data = await response.json();
                alert('Detaylar:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Detaylar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        // Sayfa yüklendiğinde
        loadKullanicilar();
    </script>
</body>
</html>
