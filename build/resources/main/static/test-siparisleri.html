<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Siparişleri - Genetik DNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-modern {
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
        }
        .table-modern {
            border-radius: 10px;
            overflow: hidden;
        }
        .table-modern thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .badge-modern {
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-shopping-cart me-2"></i>Test Siparişleri</h2>
                <div>
                    <a href="index.html" class="btn btn-secondary btn-modern me-2">
                        <i class="fas fa-arrow-left me-2"></i>Ana Sayfa
                    </a>
                    <button class="btn btn-primary btn-modern" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus me-2"></i>Yeni Sipariş
                    </button>
                    <button class="btn btn-success btn-modern" data-bs-toggle="modal" data-bs-target="#addWithNumuneModal">
                        <i class="fas fa-box me-2"></i>Sipariş + Numune (SP)
                    </button>
                </div>
            </div>

            <div id="alertContainer"></div>

            <div class="table-responsive">
                <table class="table table-modern table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kullanıcı ID</th>
                            <th>Paket ID</th>
                            <th>Sipariş Tarihi</th>
                            <th>Toplam Tutar</th>
                            <th>Ödeme Durumu</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="siparisTableBody">
                        <tr>
                            <td colspan="7" class="text-center">Yükleniyor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ekleme Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Yeni Sipariş Ekle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı ID</label>
                            <input type="number" class="form-control" name="kullaniciId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Paket ID</label>
                            <input type="number" class="form-control" name="paketId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Toplam Tutar</label>
                            <input type="number" step="0.01" class="form-control" name="toplamTutar" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ödeme Durumu</label>
                            <select class="form-select" name="odemeDurumu" required>
                                <option value="Beklemede">Beklemede</option>
                                <option value="Ödendi">Ödendi</option>
                                <option value="İptal">İptal</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="addSiparis()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sipariş + Numune Ekleme Modal (Stored Procedure) -->
    <div class="modal fade" id="addWithNumuneModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Sipariş + Numune Ekle (Stored Procedure)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addWithNumuneForm">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı ID</label>
                            <input type="number" class="form-control" name="kullaniciId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Paket ID</label>
                            <input type="number" class="form-control" name="paketId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Toplam Tutar</label>
                            <input type="number" step="0.01" class="form-control" name="toplamTutar" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Barkod ID</label>
                            <input type="text" class="form-control" name="barkodId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Numune Tipi</label>
                            <select class="form-select" name="numuneTipi" required>
                                <option value="Tükürük">Tükürük</option>
                                <option value="Kan">Kan</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-success" onclick="addSiparisWithNumune()">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Ödeme Modal -->
    <div class="modal fade" id="odemeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Sipariş Ödeme Durumu Güncelle</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="odemeForm">
                        <input type="hidden" id="odemeSiparisId">
                        <div class="mb-3">
                            <label class="form-label">Ödeme Durumu</label>
                            <select class="form-select" id="odemeDurumu" required>
                                <option value="Beklemede">Beklemede</option>
                                <option value="Ödendi">Ödendi</option>
                                <option value="İptal">İptal</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                    <button type="button" class="btn btn-primary" onclick="updateOdeme()">Güncelle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';

        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => alertContainer.innerHTML = '', 5000);
        }

        function getStatusBadge(status) {
            const badges = {
                'Ödendi': 'success',
                'Beklemede': 'warning',
                'İptal': 'danger'
            };
            return `<span class="badge bg-${badges[status] || 'secondary'} badge-modern">${status}</span>`;
        }

        async function loadSiparisler() {
            try {
                const response = await fetch(`${API_BASE}/test-siparisleri`);
                const data = await response.json();
                
                const tbody = document.getElementById('siparisTableBody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Henüz sipariş bulunmuyor.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(s => `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.kullaniciId || '-'}</td>
                        <td>${s.paketId || '-'}</td>
                        <td>${s.siparisTarihi ? new Date(s.siparisTarihi).toLocaleString('tr-TR') : '-'}</td>
                        <td>${s.toplamTutar ? s.toplamTutar.toFixed(2) + ' ₺' : '-'}</td>
                        <td>${getStatusBadge(s.odemeDurumu || 'Beklemede')}</td>
                        <td>
                            <button class="btn btn-sm btn-info me-1" onclick="viewDetails(${s.id})" title="Detaylar">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-warning me-1" onclick="updateOdemeStatus(${s.id})" title="Ödeme">
                                <i class="fas fa-money-bill"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSiparis(${s.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                showAlert('Siparişler yüklenirken hata: ' + error.message, 'danger');
            }
        }

        async function addSiparis() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            
            const data = {
                kullaniciId: parseInt(formData.get('kullaniciId')),
                paketId: parseInt(formData.get('paketId')),
                toplamTutar: parseFloat(formData.get('toplamTutar')),
                odemeDurumu: formData.get('odemeDurumu')
            };

            try {
                const response = await fetch(`${API_BASE}/test-siparisleri`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('Sipariş başarıyla eklendi!', 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    loadSiparisler();
                } else {
                    showAlert('Sipariş eklenirken hata oluştu!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function addSiparisWithNumune() {
            const form = document.getElementById('addWithNumuneForm');
            const formData = new FormData(form);
            
            const data = {
                kullaniciId: parseInt(formData.get('kullaniciId')),
                paketId: parseInt(formData.get('paketId')),
                toplamTutar: parseFloat(formData.get('toplamTutar')),
                barkodId: formData.get('barkodId'),
                numuneTipi: formData.get('numuneTipi')
            };

            try {
                const response = await fetch(`${API_BASE}/test-siparisleri/siparis-ve-numune`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    showAlert(`Sipariş ve numune başarıyla eklendi! Sipariş ID: ${result.siparis_id}, Numune ID: ${result.numune_id}`, 'success');
                    form.reset();
                    bootstrap.Modal.getInstance(document.getElementById('addWithNumuneModal')).hide();
                    loadSiparisler();
                } else {
                    showAlert('Hata: ' + (result.message || 'Bilinmeyen hata'), 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        function updateOdemeStatus(id) {
            document.getElementById('odemeSiparisId').value = id;
            new bootstrap.Modal(document.getElementById('odemeModal')).show();
        }

        async function updateOdeme() {
            const siparisId = document.getElementById('odemeSiparisId').value;
            const odemeDurumu = document.getElementById('odemeDurumu').value;
            
            const data = { odemeDurumu };

            try {
                const response = await fetch(`${API_BASE}/test-siparisleri/${siparisId}/odeme`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    showAlert('Ödeme durumu başarıyla güncellendi!', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('odemeModal')).hide();
                    loadSiparisler();
                } else {
                    showAlert('Güncelleme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function deleteSiparis(id) {
            if (!confirm('Bu siparişi silmek istediğinize emin misiniz?')) return;

            try {
                const response = await fetch(`${API_BASE}/test-siparisleri/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showAlert('Sipariş başarıyla silindi!', 'success');
                    loadSiparisler();
                } else {
                    showAlert('Silme hatası!', 'danger');
                }
            } catch (error) {
                showAlert('Hata: ' + error.message, 'danger');
            }
        }

        async function viewDetails(id) {
            try {
                const response = await fetch(`${API_BASE}/test-siparisleri/${id}/detaylar`);
                const data = await response.json();
                alert('Detaylar:\n' + JSON.stringify(data, null, 2));
            } catch (error) {
                showAlert('Detaylar yüklenirken hata: ' + error.message, 'danger');
            }
        }

        loadSiparisler();
    </script>
</body>
</html>
